[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "modeldock"
version = "0.1.0"
description = "Local multimodal model API control plane and runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic-settings==2.9.1",
  "sqlalchemy[asyncio]==2.0.40",
  "asyncpg==0.30.0",
  "alembic==1.15.2",
  "redis==5.2.1",
  "argon2-cffi==23.1.0",
  "python-multipart==0.0.20",
  "pillow==11.2.1",
  "httpx==0.28.1",
  "aiosqlite==0.21.0",
  "cryptography==46.0.7",
]
[project.optional-dependencies]
speech-edge = ["edge-tts==7.3.1"]
speech-asr = ["funasr==1.2.7", "faster-whisper==1.2.1", "torch==2.8.0", "torchaudio==2.8.0", "numpy==1.26.4", "scipy==1.15.3", "modelscope==1.31.0"]
speech-tts = ["kokoro==0.9.4", "misaki[zh]==0.9.4", "torch==2.8.0", "numpy==1.26.4", "transformers==4.51.3"]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "fakeredis[lua]==2.28.1", "ruff==0.11.7", "mypy==1.15.0", "openai==1.75.0"]
[project.scripts]
modeldock-api = "modeldock.main:run"
modeldock-worker = "modeldock.worker:run"
modeldock-init = "modeldock.bootstrap:run"
[tool.hatch.build.targets.wheel]
packages = ["backend/modeldock"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
files = ["backend/modeldock"]
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
